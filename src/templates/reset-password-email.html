<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset password</title>
  </head>
  <body style="margin: 0; padding: 24px; font-family: Arial, sans-serif; background: #f5f7fb; color: #1f2937;">
    <table
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      width="100%"
      style="max-width: 560px; margin: 0 auto; background: #ffffff; border-radius: 16px; overflow: hidden;"
    >
      <tr>
        <td style="padding: 32px;">
          <h1 style="margin: 0 0 16px; font-size: 24px; line-height: 1.3;">Password reset request</h1>
          <p style="margin: 0 0 16px; font-size: 16px; line-height: 1.6;">Hello, {{name}}!</p>
          <p style="margin: 0 0 24px; font-size: 16px; line-height: 1.6;">
            We received a request to reset your password. Click the button below to choose a new one.
          </p>
          <a
            href="{{link}}"
            style="display: inline-block; padding: 14px 24px; border-radius: 999px; background: #2563eb; color: #ffffff; text-decoration: none; font-weight: 700;"
          >
            Reset password
          </a>
          <p style="margin: 24px 0 0; font-size: 14px; line-height: 1.6; color: #6b7280;">
            This link will expire in 15 minutes. If you did not request a password reset, you can safely ignore this email.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
